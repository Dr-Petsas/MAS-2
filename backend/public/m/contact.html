<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kontakt — Clara</title>
<link rel="icon" href="/m/icon-192.png">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0d1320; color: #eef2f9; min-height: 100vh;
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 420px; background: #151d2e; border-radius: 22px;
    padding: 32px 26px; box-shadow: 0 18px 50px rgba(0,0,0,.45); text-align: center;
  }
  .avatar {
    width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 14px;
    background: linear-gradient(135deg, #4f7cff, #9b5cff);
    display: flex; align-items: center; justify-content: center;
    font-size: 30px; font-weight: 800;
  }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { font-size: 13px; color: #8fa0bd; margin-bottom: 22px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    background: #0f1626; border-radius: 14px; padding: 14px 16px; margin-bottom: 10px;
    text-align: left; gap: 12px;
  }
  .row .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #8fa0bd; }
  .row .val { font-size: 17px; font-weight: 700; word-break: break-all; }
  .row a.act {
    flex-shrink: 0; text-decoration: none; background: #4f7cff; color: white;
    font-size: 14px; font-weight: 700; padding: 10px 14px; border-radius: 12px;
  }
  .row a.act.green { background: #16a34a; }
  .copy {
    margin-top: 14px; width: 100%; background: transparent; color: #8fa0bd;
    border: 1px solid #2a3650; border-radius: 12px; padding: 12px; font-size: 14px; cursor: pointer;
  }
  .empty { color: #8fa0bd; font-size: 15px; padding: 18px 0; }
</style>
</head>
<body>
<div class="card">
  <div class="avatar" id="initials">?</div>
  <h1 id="name">Kontakt</h1>
  <div class="sub">Kontaktkarte von Clara</div>
  <div id="rows"></div>
  <button class="copy" id="copyBtn" hidden>Nummer kopieren</button>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const name = q.get("n") || "Kontakt";
  const mobile = (q.get("m") || "").trim();
  const phone = (q.get("p") || "").trim();
  const email = (q.get("e") || "").trim();

  document.getElementById("name").textContent = name;
  document.title = name + " — Clara";
  document.getElementById("initials").textContent =
    name.split(/\s+/).map(t => t[0]).filter(Boolean).slice(0, 2).join("").toUpperCase() || "?";

  const telHref = (n) => "tel:" + n.replace(/[^\d+]/g, "");
  const smsHref = (n) => "sms:" + n.replace(/[^\d+]/g, "");
  const rows = [];
  if (mobile) rows.push({ lbl: "Mobil", val: mobile, acts: [["📞 Anrufen", telHref(mobile), "green"], ["💬 SMS", smsHref(mobile), ""]] });
  if (phone && phone !== mobile) rows.push({ lbl: "Festnetz", val: phone, acts: [["📞 Anrufen", telHref(phone), "green"]] });
  if (email) rows.push({ lbl: "E-Mail", val: email, acts: [["✉️", "mailto:" + email, ""]] });

  const host = document.getElementById("rows");
  if (!rows.length) {
    host.innerHTML = '<div class="empty">Keine Kontaktdaten hinterlegt.</div>';
  }
  for (const r of rows) {
    const div = document.createElement("div");
    div.className = "row";
    const info = document.createElement("div");
    info.innerHTML = '<div class="lbl"></div><div class="val"></div>';
    info.querySelector(".lbl").textContent = r.lbl;
    info.querySelector(".val").textContent = r.val;
    div.appendChild(info);
    for (const [label, href, cls] of r.acts) {
      const a = document.createElement("a");
      a.className = "act " + cls;
      a.href = href;
      a.textContent = label;
      div.appendChild(a);
    }
    host.appendChild(div);
  }

  const best = mobile || phone;
  if (best) {
    const btn = document.getElementById("copyBtn");
    btn.hidden = false;
    btn.onclick = async () => {
      try { await navigator.clipboard.writeText(best); btn.textContent = "Kopiert ✓"; } catch {}
    };
  }
</script>
</body>
</html>
