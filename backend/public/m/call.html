<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Clara</title>
  <link rel="manifest" href="/m/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/m/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#060b16" />
  <style>
    /* ══════════════════════════════════════════════════════════════════════
       Clara Handy-App im pickadoc.ai-Hero-Design (04.07.2026).
       Das Handy IST das Telefon aus dem Website-Hero: Sprachseite (Orb,
       Zustandsfarben, Agenten-Chips) und per Klick/Swipe geflippte
       Kartenseite ("Nächster Patient" / "Das Wichtigste" / Doku-Memos).
       Farbwelt exakt wie index.html der Website:
         hört zu = Lila #b84dff · denkt nach = Gelb #f5c518 · spricht = Grün #34d399
       ══════════════════════════════════════════════════════════════════════ */
    :root {
      color-scheme: dark;
      --bg-1: #13203a;
      --bg-2: #0a1322;
      --bg-3: #060b16;
      --ink: #e6edf6;
      --ink-soft: #8fa3bd;
      --turq: #2ee6c8;        /* neon türkis — Akzente, Nutzer spricht */
      --amber: #f5c518;       /* denkt nach (Website-Hero) */
      --red: #ff4d6d;         /* Auflegen/Fehler */
      --pink: #ff4ddb;        /* Startzustand */
      --purple: #b84dff;      /* hört zu (Website-Hero) */
      --green: #34d399;       /* spricht (Website-Hero) */
      --accent: var(--purple);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; }
    body {
      font-family: system-ui, "Segoe UI", Roboto, sans-serif; margin: 0; color: var(--ink);
      background: radial-gradient(130% 95% at 50% 0%, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column;
      padding: calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 18px);
      user-select: none; -webkit-user-select: none;
      transition: background .55s ease;
      overflow: hidden;
    }
    /* Zustands-Hintergründe wie clara-phone__screen auf der Website. */
    body.st-idle       { --accent: var(--pink);   background: radial-gradient(120% 90% at 50% 0%, #2a1030 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    body.st-ringing    { --accent: var(--turq);   background: radial-gradient(120% 90% at 50% 0%, #0f2a28 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    body.st-connecting { --accent: var(--amber);  background: radial-gradient(120% 90% at 50% 0%, #2a2410 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    body.st-listening  { --accent: var(--purple); background: radial-gradient(120% 90% at 50% 0%, #1a1230 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    body.st-user       { --accent: var(--turq);   background: radial-gradient(120% 90% at 50% 0%, #0f2a28 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    body.st-thinking   { --accent: var(--amber);  background: radial-gradient(120% 90% at 50% 0%, #2a2410 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    body.st-clara      { --accent: var(--green);  background: radial-gradient(120% 90% at 50% 0%, #0f2a24 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    /* Wake-Word-Standby ("Clara stopp"): gelb wie Pause, aber ruhig —
       kein Denk-Puls. Unterscheidet sich von st-thinking durch Label+Orb. */
    body.st-standby    { --accent: var(--amber);  background: radial-gradient(120% 90% at 50% 0%, #2a2410 0%, var(--bg-2) 55%, var(--bg-3) 100%); }
    body.st-ended      { --accent: var(--ink-soft); }
    /* Glow-Aura oben, wie ::before im Website-Screen. */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background: radial-gradient(circle at 50% 26%, color-mix(in srgb, var(--accent) 22%, transparent), transparent 58%);
      transition: background .55s ease;
    }
    body > * { position: relative; z-index: 1; }

    /* ── Header: Pickadoc-Logo + Einstellungen ─────────────────────────── */
    .brand { display: flex; align-items: center; justify-content: center; gap: 9px; position: relative; flex: none; }
    .brand img { height: 22px; width: auto; display: block; opacity: .95; }
    .brand .word { font-size: 19px; font-weight: 700; letter-spacing: .3px; color: var(--ink); }
    .brand .word b { color: var(--turq); font-weight: 700; }
    .gear { position: absolute; right: -6px; top: -2px; color: var(--ink-soft); text-decoration: none;
            font-size: 17px; padding: 8px; opacity: .65; }
    .tourlink { position: absolute; left: -6px; top: -2px; color: var(--ink-soft); text-decoration: none;
            font-size: 17px; padding: 8px; opacity: .65; }

    /* ── Audio / Chat Umschalter (dezent oben, wie cp-mode im Hero) ─────── */
    .mode-bar {
      display: flex; justify-content: center; margin: 8px auto 0; gap: 4px;
      padding: 3px; border-radius: 999px; background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08); width: fit-content; flex: none;
    }
    .mode-bar button {
      border: 0; background: transparent; color: var(--ink-soft); font-size: 12px;
      font-weight: 700; padding: 6px 14px; border-radius: 999px; cursor: pointer;
    }
    .mode-bar button.active { background: rgba(46,230,200,.18); color: var(--turq); }

    /* Strikt entweder Audio ODER Chat – kein gleichzeitiges Layout */
    body.clara-mode-audio [data-clara-chat-pane] { display: none !important; }
    body.clara-mode-chat [data-clara-audio-pane],
    body.clara-mode-chat [data-clara-bottom-bar],
    body.clara-mode-chat [data-clara-flip-labels] { display: none !important; }

    /* ══ FLIP: Sprachseite <-> Kartenseite (wie cc-flip im Website-Hero) ══ */
    [data-clara-audio-pane] { flex: 1; display: flex; flex-direction: column; min-height: 0; }
    .flip { flex: 1; min-height: 0; perspective: 1400px; }
    .flip-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d; -webkit-transform-style: preserve-3d;
      transition: transform .75s cubic-bezier(.35,.1,.25,1);
      will-change: transform;
    }
    .flip.is-flipped .flip-inner { transform: rotateY(180deg); }
    .flip-face {
      position: absolute; inset: 0; display: flex; flex-direction: column; min-height: 0;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    .flip-face--voice { transform: rotateY(0deg) translateZ(1px); }
    .flip-face--cards { transform: rotateY(180deg) translateZ(1px); }
    /* Sichtbarkeits-Härtung (Safari-Backface): abgewandte Seite ausblenden. */
    .flip:not(.is-flipped) .flip-face--cards { opacity: 0; pointer-events: none; transition: opacity .3s .1s; }
    .flip.is-flipped .flip-face--cards { opacity: 1; pointer-events: auto; transition: opacity .3s .35s; }
    .flip.is-flipped .flip-face--voice { opacity: 0; pointer-events: none; transition: opacity .3s .1s; }
    .flip:not(.is-flipped) .flip-face--voice { opacity: 1; pointer-events: auto; transition: opacity .3s .35s; }
    @media (prefers-reduced-motion: reduce) {
      .flip-inner { transition: none; }
      .flip-face { transition: none !important; }
    }

    /* Flip-Beschriftung unten (wie cc-flip-labels: TEXT · SPRACHE) */
    .flip-labels {
      display: flex; justify-content: center; gap: 16px; margin-top: 10px; flex: none;
      font-size: 10px; font-weight: 900; letter-spacing: .09em; text-transform: uppercase;
    }
    .flip-labels span { color: rgba(255,255,255,.35); transition: color .35s; cursor: pointer; padding: 4px 6px; }
    .flip-labels span.on { color: var(--turq); }
    .flip-labels .badge {
      display: inline-grid; place-items: center; min-width: 15px; height: 15px; margin-left: 4px;
      padding: 0 4px; border-radius: 999px; background: var(--pink); color: #fff;
      font-size: 9px; font-weight: 900; vertical-align: 1px;
    }
    .flip-labels .badge:empty { display: none; }

    /* ── Sprachseite (cp-* aus dem Hero) ────────────────────────────────── */
    .top { text-align: center; margin-top: 14px; flex: none; }
    .calling { color: var(--ink-soft); font-size: 14px; letter-spacing: .4px; min-height: 19px; }
    .name { font-size: 30px; font-weight: 700; margin: 5px 0 0; letter-spacing: -.02em; }
    .reason { color: var(--turq); font-size: 15px; margin-top: 4px; min-height: 21px; opacity: .85; }

    .mid { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; min-height: 0; }
    .orb-wrap { position: relative; width: 176px; height: 176px; }
    .orb {
      position: relative; z-index: 2; width: 176px; height: 176px; border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--accent) 65%, transparent);
      background:
        radial-gradient(100% 100% at 30% 25%, color-mix(in srgb, var(--accent) 16%, transparent) 0%, transparent 60%),
        radial-gradient(120% 120% at 50% 50%, #101b30 0%, #0a1424 70%);
      display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0;
      box-shadow: 0 0 42px color-mix(in srgb, var(--accent) 28%, transparent),
                  inset 0 0 30px color-mix(in srgb, var(--accent) 10%, transparent);
      transition: border-color .45s ease, box-shadow .45s ease;
      touch-action: manipulation;
    }
    .orb:active { transform: scale(.97); }

    .wave { display: flex; align-items: center; gap: 9px; height: 60px; pointer-events: none; }
    .wave span { width: 10px; border-radius: 7px; background: var(--accent);
                 box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 60%, transparent);
                 transition: background .45s ease, box-shadow .45s ease;
                 animation: wob 1.6s ease-in-out infinite; }
    .wave span:nth-child(1) { height: 28px; }
    .wave span:nth-child(2) { height: 54px; animation-delay: .2s; }
    .wave span:nth-child(3) { height: 28px; animation-delay: .4s; }
    @keyframes wob { 0%, 100% { transform: scaleY(.72); } 50% { transform: scaleY(1.08); } }
    body.st-ended .wave span { animation-play-state: paused; }

    .ring { position: absolute; inset: -4px; border-radius: 50%; z-index: 1;
            border: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); opacity: 0; pointer-events: none; }
    @keyframes rip { 0% { transform: scale(.96); opacity: .75; } 100% { transform: scale(1.5); opacity: 0; } }
    @keyframes ripSoft { 0% { transform: scale(.98); opacity: .4; } 100% { transform: scale(1.28); opacity: 0; } }
    @keyframes breathe {
      0%, 100% { box-shadow: 0 0 34px color-mix(in srgb, var(--accent) 20%, transparent), inset 0 0 26px color-mix(in srgb, var(--accent) 8%, transparent); }
      50%      { box-shadow: 0 0 58px color-mix(in srgb, var(--accent) 42%, transparent), inset 0 0 34px color-mix(in srgb, var(--accent) 14%, transparent); }
    }
    @keyframes thinkPulse {
      0%, 100% { border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
      50%      { border-color: color-mix(in srgb, var(--accent) 90%, transparent); }
    }
    body.st-idle .orb { animation: breathe 3s ease-in-out infinite; }
    body.st-idle .ring.r1 { animation: rip 1.8s ease-out infinite; }
    body.st-idle .ring.r2 { animation: rip 1.8s ease-out .9s infinite; }
    body.st-ringing .ring.r1 { animation: rip 1.5s ease-out infinite; }
    body.st-ringing .ring.r2 { animation: rip 1.5s ease-out .75s infinite; }
    body.st-connecting .orb { animation: breathe 1.1s ease-in-out infinite; }
    body.st-listening .orb { animation: breathe 3.2s ease-in-out infinite; }
    body.st-listening .ring.r1 { animation: ripSoft 1.8s ease-out infinite; }
    body.st-user .ring.r1 { animation: ripSoft 1s ease-out infinite; }
    body.st-user .orb { animation: breathe 1.4s ease-in-out infinite; }
    body.st-thinking .orb { animation: thinkPulse 1s ease-in-out infinite; }
    body.st-thinking .ring.r1 { animation: ripSoft 1.6s ease-out infinite; }
    body.st-clara .orb { animation: breathe 1.3s ease-in-out infinite; }
    body.st-clara .ring.r1 { animation: rip 1.6s ease-out infinite; }
    body.st-clara .ring.r2 { animation: rip 1.6s ease-out .8s infinite; }
    /* Standby: ruhiges, langsames Atmen — pausiert, nicht beschäftigt. */
    body.st-standby .orb { animation: breathe 5s ease-in-out infinite; opacity: .82; }
    body.st-standby .wave span { animation-play-state: paused; opacity: .5; }

    .state-label { font-size: 15px; font-weight: 700; letter-spacing: .3px; min-height: 22px;
                   color: var(--accent); transition: color .45s ease; text-align: center; }
    .hint { color: var(--ink-soft); font-size: 13px; min-height: 18px; text-align: center; }

    /* Agenten-Chips wie cp-agents im Hero: leuchten beim Denken/Antworten. */
    .agents { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; padding: 0 8px; }
    .agents span {
      padding: 4px 9px; border-radius: 999px; font-size: 10px; font-weight: 800; letter-spacing: .02em;
      color: rgba(255,255,255,.82); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12);
      opacity: .45; transform: translateY(4px);
      transition: opacity .35s ease, transform .35s ease, color .35s ease, background .35s ease, border-color .35s ease, box-shadow .35s ease;
    }
    body.st-thinking .agents span, body.st-clara .agents span { opacity: .85; transform: none; }
    .agents span.is-asking { opacity: 1 !important; transform: translateY(0) scale(1.06); color: var(--amber);
      background: rgba(245,197,24,.16); border-color: rgba(245,197,24,.6); animation: chipRipple 1.4s ease-out infinite; }
    .agents span.is-answered { opacity: 1 !important; transform: translateY(0) scale(1.06); color: var(--green);
      background: rgba(52,211,153,.18); border-color: rgba(52,211,153,.65); box-shadow: 0 0 14px rgba(52,211,153,.32); }
    @keyframes chipRipple { 0% { box-shadow: 0 0 0 0 rgba(245,197,24,.55); } 70% { box-shadow: 0 0 0 9px rgba(245,197,24,0); } 100% { box-shadow: 0 0 0 0 rgba(245,197,24,0); } }

    .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; min-height: 56px; flex: none; }
    .decline-link { background: none; border: 0; color: var(--red); opacity: .8; font-size: 15px;
                    font-weight: 600; cursor: pointer; padding: 10px 18px; }
    .enable { display: none; margin: 0 auto; background: var(--amber); color: #131a26; border: 0; border-radius: 12px;
              padding: 12px 20px; font-size: 15px; font-weight: 700; cursor: pointer; }
    .enable.show { display: block; }
    .status { text-align: center; color: var(--ink-soft); font-size: 13px; min-height: 18px; }
    .hidden { display: none !important; }

    /* ══ KARTENSEITE (cc-screen--text aus dem Hero) ══════════════════════ */
    .cards-face-head { text-align: center; margin: 12px 0 10px; flex: none; }
    .cards-face-head b { display: block; color: #fff; font-size: 20px; font-weight: 900; letter-spacing: -.01em; }
    .cards-face-head small { display: block; color: var(--turq); font-size: 10.5px; font-weight: 800; letter-spacing: .06em; margin-top: 2px; }
    .cards-face-state { display: inline-flex; align-items: center; gap: 6px; margin-top: 7px;
      font-size: 10px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-soft); }
    .cards-face-state i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent);
      box-shadow: 0 0 8px var(--accent); transition: background .45s ease; }
    .cards-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px;
      padding: 2px 2px 14px; -webkit-overflow-scrolling: touch; }
    .cards-empty { color: var(--ink-soft); font-size: 13.5px; text-align: center; line-height: 1.55; padding: 26px 18px; }
    .cards-empty b { color: var(--ink); }

    /* ── Die Karte: exakt das cc-next / cc-key Motiv des Website-Heros ──── */
    .card {
      background: radial-gradient(130% 80% at 50% 0%, #181430 0%, #0b1020 52%, #060a14 100%);
      border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 13px 13px 12px;
      box-shadow: 0 14px 34px rgba(0,0,0,.45);
    }
    .card-next { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.12);
      border-radius: 14px; padding: 11px 12px; }
    .card-tag { font-size: 9.5px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase; color: #cfa3ff; }
    .card-name { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 4px; }
    .card-name b { color: #fff; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
    .card-time { font-size: 12.5px; font-weight: 800; color: var(--turq); white-space: nowrap; }
    .card-why { margin-top: 3px; font-size: 11.5px; color: rgba(255,255,255,.62); }
    .card-key { margin-top: 10px; }
    .card-key-h { font-size: 9.5px; font-weight: 900; letter-spacing: .12em; text-transform: uppercase;
      color: rgba(255,255,255,.45); margin: 0 2px 7px; }
    .card-key ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
    .card-key li { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #e7edf6;
      padding: 6px 8px; border-radius: 10px; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.06);
      line-height: 1.35; }
    .card-key li i { width: 20px; height: 20px; border-radius: 6px; display: grid; place-items: center; flex: none; }
    .card-key li i svg { width: 12px; height: 12px; display: block; }
    .card-key li.is-alert i { background: rgba(255,111,97,.18); color: #ff9b90; }
    .card-key li.is-warn  i { background: rgba(245,197,24,.16); color: var(--amber); }
    .card-key li.is-info  i { background: rgba(46,230,200,.14); color: var(--turq); }
    .card-key li.is-ok    i { background: rgba(52,211,153,.16); color: var(--green); }
    /* Muelltonne je Kandidat (Anrufliste): fester Button am Zeilenende —
       bewusst KEINE Wischgeste (kollidierte mit dem Karten-Flip, Chef 28.07.). */
    .card-key li .card-trash { margin-left: auto; flex: none; width: 32px; height: 32px;
      border-radius: 9px; display: grid; place-items: center; padding: 0; cursor: pointer;
      border: 1px solid rgba(255,111,97,.35); background: rgba(255,80,80,.12); color: #ff9b90; }
    .card-key li .card-trash svg { width: 15px; height: 15px; display: block; }
    .card-key li .card-trash:active { transform: scale(.92); }
    .card-key li.is-removing { opacity: .35; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 9px; padding: 0 2px; }
    .card-foot .fnote { font-size: 10.5px; font-weight: 800; color: var(--ink-soft); }
    .card-foot .fwhen { font-size: 10px; color: rgba(255,255,255,.35); }
    .card.is-new { animation: cardIn .5s cubic-bezier(.2,.9,.3,1.2); }
    @keyframes cardIn { 0% { opacity: 0; transform: translateY(14px) scale(.97); } 100% { opacity: 1; transform: none; } }

    /* ── Chat-Vollbild (gleiche Karten inline im Verlauf) ────────────────── */
    .chat-pane { flex: 1; display: flex; flex-direction: column; min-height: 0; margin-top: 8px; }
    .chat-scroll {
      flex: 1; overflow: auto; display: flex; flex-direction: column; gap: 10px;
      padding: 8px 2px 12px; -webkit-overflow-scrolling: touch;
    }
    .chat-scroll .card { align-self: stretch; }
    .clara-bubble {
      max-width: 88%; padding: 11px 14px; border-radius: 16px; font-size: 15px;
      line-height: 1.45; white-space: pre-wrap; word-break: break-word;
    }
    .clara-bubble-user {
      align-self: flex-end; background: rgba(255,179,71,.16); border: 1px solid rgba(255,179,71,.35);
      border-bottom-right-radius: 4px;
    }
    .clara-bubble-assistant {
      align-self: flex-start; background: rgba(46,230,200,.12); border: 1px solid rgba(46,230,200,.28);
      border-bottom-left-radius: 4px;
    }
    .clara-bubble.partial { opacity: .65; font-style: italic; }
    .chat-compose {
      display: flex; gap: 8px; align-items: flex-end; padding-top: 8px;
      border-top: 1px solid rgba(255,255,255,.08); flex: none;
    }
    .chat-compose textarea {
      flex: 1; min-height: 42px; max-height: 120px; resize: none; border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12); background: rgba(0,0,0,.22); color: var(--ink);
      padding: 10px 12px; font: inherit;
    }
    .chat-compose button {
      border: 0; border-radius: 12px; background: var(--turq); color: #0a1322;
      font-weight: 700; padding: 10px 14px; cursor: pointer;
    }
    .clara-proof-card {
      align-self: stretch; background: rgba(15,23,42,.72); border: 1px solid rgba(52,211,153,.35);
      border-radius: 14px; padding: 12px 14px; font-size: 14px;
    }
    .clara-proof-head { color: #34d399; font-weight: 700; margin-bottom: 8px; }
    .clara-proof-line { display: flex; justify-content: space-between; gap: 10px; margin: 4px 0; }
    .clara-proof-line span { color: var(--ink-soft); }
    .clara-proof-img { width: 100%; margin-top: 10px; border-radius: 10px; background: #fff; }
    .proof-strip { margin-top: 10px; }

    /* ── Chat: Verbinden + Zustands-Orb (Mitte) ─────────────────────────── */
    .chat-mid {
      flex: 0 0 auto; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 16px 0 10px; min-height: 148px;
    }
    .chat-connect-btn {
      border: 0; border-radius: 999px; padding: 14px 34px; font-size: 16px; font-weight: 700;
      cursor: pointer; color: #0a1322; background: var(--green);
      box-shadow: 0 0 28px color-mix(in srgb, var(--green) 45%, transparent);
      touch-action: manipulation;
    }
    .chat-connect-btn:active { transform: scale(.97); }
    .chat-orb-wrap { position: relative; width: 132px; height: 132px; }
    .chat-orb {
      position: relative; z-index: 2; width: 132px; height: 132px; border-radius: 50%;
      border: 2px solid color-mix(in srgb, var(--chat-accent, var(--green)) 65%, transparent);
      background:
        radial-gradient(100% 100% at 30% 25%, color-mix(in srgb, var(--chat-accent, var(--green)) 16%, transparent) 0%, transparent 60%),
        radial-gradient(120% 120% at 50% 50%, #101b30 0%, #0a1424 70%);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 0 34px color-mix(in srgb, var(--chat-accent, var(--green)) 28%, transparent),
                  inset 0 0 22px color-mix(in srgb, var(--chat-accent, var(--green)) 10%, transparent);
      transition: border-color .45s ease, box-shadow .45s ease;
    }
    .chat-orb .wave span {
      background: var(--chat-accent, var(--green));
      box-shadow: 0 0 12px color-mix(in srgb, var(--chat-accent, var(--green)) 60%, transparent);
    }
    .chat-ring {
      position: absolute; inset: -3px; border-radius: 50%; z-index: 1;
      border: 2px solid color-mix(in srgb, var(--chat-accent, var(--green)) 55%, transparent);
      opacity: 0; pointer-events: none;
    }
    .chat-state-label {
      font-size: 14px; font-weight: 600; letter-spacing: .2px; min-height: 20px;
      color: var(--chat-accent, var(--green)); text-align: center; transition: color .45s ease;
      padding: 0 12px; line-height: 1.35;
    }
    .chat-state-label.has-status { color: var(--ink-soft); font-weight: 500; }
    .chat-enable {
      border: 0; border-radius: 12px; background: #f59e0b; color: #0a1322;
      font-weight: 700; padding: 10px 16px; cursor: pointer; display: none;
    }
    .chat-enable.show { display: block; }
    .chat-st-connecting { --chat-accent: var(--amber); }
    .chat-st-connecting .chat-orb { animation: breathe 1.1s ease-in-out infinite; }
    .chat-st-listening { --chat-accent: var(--green); }
    .chat-st-listening .chat-orb { animation: breathe 3s ease-in-out infinite; }
    .chat-st-listening .chat-ring.r1 { animation: ripSoft 1.8s ease-out infinite; }
    /* Chat = nur Tippen: kein Mikro-Wellenform-Symbol im Bereit-Zustand */
    .chat-st-listening .chat-orb .wave,
    .chat-st-idle .chat-orb .wave { display: none; }
    .chat-st-thinking { --chat-accent: var(--purple); }
    .chat-st-thinking .chat-orb { animation: thinkPulse 1s ease-in-out infinite; }
    .chat-st-thinking .chat-ring.r1 { animation: ripSoft 1.6s ease-out infinite; }
    .chat-st-writing { --chat-accent: var(--amber); }
    .chat-st-writing .chat-orb { animation: breathe 1.3s ease-in-out infinite; }
    .chat-st-writing .chat-ring.r1 { animation: rip 1.5s ease-out infinite; }
    .chat-st-writing .chat-ring.r2 { animation: rip 1.5s ease-out .75s infinite; }
  </style>
</head>
<body class="st-idle clara-mode-audio" data-clara-root>
  <header class="brand">
    <a class="tourlink" href="/m/clara-tour.html" aria-label="Clara-Tour" title="Clara-Tour – was ich alles kann">&#127911;</a>
    <img src="/m/logo-mark.png" alt="" />
    <span class="word">pickadoc</span>
    <a class="gear" href="/m/pair.html?manage=1" aria-label="Einstellungen">&#9881;</a>
  </header>

  <div class="mode-bar" data-clara-mode-bar>
    <button type="button" class="active" data-clara-mode-audio aria-pressed="true">🎙 Audio</button>
    <button type="button" data-clara-mode-chat aria-pressed="false">💬 Chat</button>
  </div>

  <div data-clara-audio-pane>
    <div class="flip" data-clara-flip>
      <div class="flip-inner">

        <!-- Vorderseite: die Sprach-Leitstelle (Orb + Zustandsfarben) -->
        <div class="flip-face flip-face--voice" data-clara-face-voice>
          <div class="top">
            <div class="calling" id="calling">ruft an …</div>

            <div class="reason" id="reason"></div>
          </div>

          <div class="mid">
            <div class="orb-wrap">
              <div class="ring r1"></div><div class="ring r2"></div>
              <button class="orb" id="orb" aria-label="Clara">
                <div class="wave"><span></span><span></span><span></span></div>
              </button>
            </div>
            <div>
              <div class="state-label" id="stateLabel"></div>
              <div class="hint" id="hint"></div>

            <div class="agents" id="agents" aria-hidden="true">
              <span>Bianca</span><span>Lisa</span><span>Nadine</span><span>Marie</span><span>Sophie</span><span>Julia</span><span>Lena</span>
            </div>
          </div>

          <div class="proof-strip hidden" data-clara-proof-strip></div>

        <!-- Rückseite: Übersichtskarten (Heads-up, Doku-Memos, Tagesplan) -->
        <div class="flip-face flip-face--cards" data-clara-face-cards>

            <b>Clara</b>

          </div>
          <div class="cards-scroll" data-clara-cards>
            <div class="cards-empty" data-clara-cards-empty>
              Noch keine Karten.<br/>
              Frag mich z.&nbsp;B. <b>„Heads up zum nächsten Patienten"</b> oder diktiere eine
              Behandlung — die Notizen erscheinen hier auf der Rückseite.

    <div class="flip-labels" data-clara-flip-labels aria-hidden="true">

    </div>

    <div class="bottom" data-clara-bottom-bar>
      <button class="enable" id="enableBtn">&#128266; Ton aktivieren (tippen)</button>
      <button class="decline-link hidden" id="btnDecline">Ablehnen</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <section class="chat-pane hidden" data-clara-chat-pane>
    <div class="chat-scroll" data-clara-chat-scroll></div>
    <div class="chat-mid chat-st-idle" data-clara-chat-mid>
      <button type="button" class="chat-connect-btn" data-clara-chat-connect>Verbinden</button>
      <div class="chat-orb-wrap hidden" data-clara-chat-orb-wrap>
        <div class="chat-ring r1"></div><div class="chat-ring r2"></div>
        <div class="chat-orb" data-clara-chat-orb aria-hidden="true">
          <div class="wave"><span></span><span></span><span></span></div>
        </div>
      </div>
      <div class="chat-state-label" data-clara-chat-state></div>
      <button type="button" class="chat-enable" data-clara-chat-enable>&#128266; Ton aktivieren (tippen)</button>
    </div>
    <div class="chat-compose">
      <textarea rows="1" placeholder="Nachricht an Clara …" data-clara-chat-input></textarea>
      <button type="button" data-clara-chat-send>Senden</button>
    </div>
  </section>

  <audio id="agentAudio" autoplay playsinline></audio>

  <script>
    // iOS-Kopplung: Die installierte App startet hier (start_url), aber der
    // gescannte QR-Token liegt noch unbenutzt im Speicher (pair.html hat ihn
    // vor dem "Zum Home-Bildschirm"-Schritt hinterlegt). Ohne gekoppeltes
    // Gerät geht es deshalb zuerst zur Kopplungsseite.
    try {
      var pendingPair = JSON.parse(localStorage.getItem("clara.pendingPair.v1") || "null");
      var pairedDevice = JSON.parse(localStorage.getItem("clara.device.v1") || "null");
      if (pendingPair && pendingPair.c && pendingPair.t && !pairedDevice &&
          Date.now() - (pendingPair.ts || 0) < 15 * 60 * 1000) {
        location.replace("/m/pair.html?c=" + encodeURIComponent(pendingPair.c) + "&t=" + encodeURIComponent(pendingPair.t));
      }
    } catch (e) {}
  </script>

  <script type="module">
    import { Room, RoomEvent, Track } from "https://cdn.jsdelivr.net/npm/livekit-client@2.7.5/dist/livekit-client.esm.mjs";
    // ?v= bustet den HTTP-Cache installierter PWAs beim Modul-Update.
    import { mountClaraChat, renderOverviewCard } from "/m/clara-chat.js?v=karten-2";

    const qs = new URLSearchParams(location.search);
    const STORE_KEY = "clara.device.v1";
    let device = null;
    try { device = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); } catch {}
    const clientId = (qs.get("c") || device?.clientId || "").trim();
    const reasonText = (qs.get("reason") || "").trim();
    const incoming = !!reasonText; // opened from a push -> behave like a ringing call

    if (!clientId) {
      location.replace("/m/pair.html?manage=1");
      throw new Error("no clientId");
    }

    // State must exist before mountClaraChat — setMode("audio") calls onModeChange
    // synchronously, which touches room/connected/phase (TDZ crash otherwise).
    let room = null;
    let connected = false;
    let connecting = false;
    let audioAttached = false;
    let chatPipeline = false;
    let phase = incoming ? "ringing" : "idle";
    let voice = "listening";
    let wakeStandby = false;

    const chatUi = mountClaraChat(document.body, {
      async onSend(text) {
        if (!room?.localParticipant) {
          setStatus("Bitte zuerst verbinden.");
          chatUi.setConnectVisible(true);
          chatUi.setChatVisual("idle");
          return;
        }
        chatUi.setStatusLine("");
        chatUi.setChatVisual("thinking");
        const data = new TextEncoder().encode(JSON.stringify({ type: "chat", text }));
        await room.localParticipant.publishData(data, { topic: "pickadoc.cmd", reliable: true });
      },
      onConnect() {
        if (phase === "connecting") return;
        chatUi.setStatusLine("");
        connect({ textOnly: chatUi.getMode() === "chat" });
      },
      onModeChange(mode) {
        syncMicForMode(mode);
        if (connected && room?.localParticipant) {
          const wantText = mode === "chat";
          if (wantText !== chatPipeline) {
            chatPipeline = wantText;
            const data = new TextEncoder().encode(JSON.stringify({
              type: "set_pipeline",
              mode: wantText ? "text" : "audio",
            }));
            room.localParticipant.publishData(data, { topic: "pickadoc.cmd", reliable: true }).catch(() => {});
          }
        }
      },
      // Übersichtskarte vom Worker: auf den Karten-Stapel der Flip-Rückseite
      // legen; im Audio-Modus automatisch hinflippen (Diktat-Notizen live).
      onCard(card) {
        addCardToDeck(card);
      },
    });

    const proofFromUrl = (qs.get("proof") || "").trim();
    if (proofFromUrl) chatUi.setMode("chat", { focus: false });

    const els = {
      calling: document.getElementById("calling"),
      reason: document.getElementById("reason"),
      status: document.getElementById("status"),
      stateLabel: document.getElementById("stateLabel"),
      hint: document.getElementById("hint"),
      orb: document.getElementById("orb"),
      btnDecline: document.getElementById("btnDecline"),
      enableBtn: document.getElementById("enableBtn"),
      chatEnableBtn: document.querySelector("[data-clara-chat-enable]"),
      audio: document.getElementById("agentAudio"),
      flip: document.querySelector("[data-clara-flip]"),
      cardsScroll: document.querySelector("[data-clara-cards]"),
      cardsEmpty: document.querySelector("[data-clara-cards-empty]"),
      cardBadge: document.querySelector("[data-clara-card-badge]"),
      lblVoice: document.querySelector("[data-clara-lbl-voice]"),
      lblCards: document.querySelector("[data-clara-lbl-cards]"),
      cardsStateLabel: document.getElementById("cardsStateLabel"),
      agents: document.getElementById("agents"),
    };

    function setStatus(s) {
      els.status.textContent = s;
      if (chatUi.getMode() === "chat") chatUi.setStatusLine(s);
    }

    function showEnable(on) {
      els.enableBtn.classList.toggle("show", !!on);
      els.chatEnableBtn?.classList.toggle("show", !!on);
    }

    // ── Flip: Sprache <-> Karten (Klick auf Label/Fläche oder Swipe) ─────────
    let flipped = false;
    let unseenCards = 0;

    function setFlipped(on) {
      flipped = !!on;
      els.flip?.classList.toggle("is-flipped", flipped);
      els.lblVoice?.classList.toggle("on", !flipped);
      els.lblCards?.classList.toggle("on", flipped);
      if (flipped) {
        unseenCards = 0;
        updateBadge();
      }
    }
    function updateBadge() {
      if (els.cardBadge) els.cardBadge.textContent = unseenCards > 0 ? String(unseenCards) : "";
    }

    els.lblVoice?.addEventListener("click", () => setFlipped(false));
    els.lblCards?.addEventListener("click", () => setFlipped(true));

    // Klick auf freie Fläche flippt (Orb, Buttons, Links und die Karten
    // selbst bleiben bedienbar — die Karte anzutippen blättert NICHT um).
    els.flip?.addEventListener("click", (e) => {
      if (e.target.closest("button, a, textarea, .card")) return;
      setFlipped(!flipped);
    });

    // Swipe (horizontal) flippt — vertikales Scrollen der Karten bleibt frei.
    let touchX = 0, touchY = 0, touchAt = 0;
    els.flip?.addEventListener("touchstart", (e) => {
      const t = e.touches[0];
      touchX = t.clientX; touchY = t.clientY; touchAt = Date.now();
    }, { passive: true });
    els.flip?.addEventListener("touchend", (e) => {
      const t = e.changedTouches[0];
      const dx = t.clientX - touchX;
      const dy = t.clientY - touchY;
      if (Date.now() - touchAt < 600 && Math.abs(dx) > 60 && Math.abs(dy) < 50) {
        setFlipped(!flipped);
      }
    }, { passive: true });

    // ── Karten-Stapel (Rückseite): neueste oben, Sitzung übersteht Reload ──
    const CARDS_KEY = "clara.cards.v1";
    let deck = [];
    try { deck = JSON.parse(sessionStorage.getItem(CARDS_KEY) || "[]"); } catch {}
    if (!Array.isArray(deck)) deck = [];

    // Muelltonne auf der Kandidaten-Karte: Server-Aufruf (deviceKey-gesichert)
    // + Deck-Pflege, damit Reload/Flip die entfernte Zeile nicht zurueckholt.
    async function removeKandidatVomServer({ caseId, patientId }) {
      if (!device?.deviceId || !device?.deviceKey || !caseId || !patientId) return false;
      try {
        const resp = await fetch("/clara/devices/recall-remove", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            clientId, deviceId: device.deviceId, deviceKey: device.deviceKey,
            caseId, patientId,
          }),
        });
        const j = await resp.json().catch(() => null);
        if (!resp.ok || j?.ok === false) return false;
        for (const entry of deck) {
          if (entry.card?.kind === "recall_kandidaten" && entry.card?.caseId === caseId) {
            // Server liefert die frische Karte mit (Puffer-Nachruecker!) —
            // komplett ersetzen; nur zur Not lokal ausblenden.
            if (j?.card) entry.card = j.card;
            else entry.card.items = (entry.card.items || []).filter((it) => it.pid !== patientId);
          }
        }
        try { sessionStorage.setItem(CARDS_KEY, JSON.stringify(deck)); } catch {}
        renderDeck();
        return true;
      } catch { return false; }
    }

    function renderDeck() {
      if (!els.cardsScroll) return;
      els.cardsScroll.querySelectorAll(".card").forEach((n) => n.remove());
      if (els.cardsEmpty) els.cardsEmpty.classList.toggle("hidden", deck.length > 0);
      for (const entry of deck) {
        const el = renderOverviewCard(entry.card, { when: entry.when, onRemoveKandidat: removeKandidatVomServer });
        els.cardsScroll.appendChild(el);
      }
    }

    function addCardToDeck(card) {
      const when = new Date().toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" });
      // Gleiche Karte (Art + Titel) ersetzen statt stapeln — beim Diktieren
      // wächst EINE Doku-Karte mit, statt fünf fast gleiche zu zeigen.
      deck = deck.filter((e) => !(e.card?.kind === card.kind && e.card?.title === card.title));
      deck.unshift({ card, when });
      deck = deck.slice(0, 12);
      try { sessionStorage.setItem(CARDS_KEY, JSON.stringify(deck)); } catch {}
      renderDeck();
      const first = els.cardsScroll?.querySelector(".card");
      if (first) {
        first.classList.add("is-new");
        els.cardsScroll.scrollTop = 0;
      }
      // 29.07.2026 (Chef: "sobald schriftliche Karten verfuegbar sind, EGAL WAS,
      // die Page automatisch auf die verschriftlichten Inhalte flippen"): JEDE
      // eingehende Karte flippt sofort auf die Karten-Seite — unabhaengig von
      // Kartenart UND Modus. Im Chat-Modus ist die Flip-Flaeche zwar
      // ausgeblendet (die Karten stehen dort ohnehin im Verlauf), das Setzen
      // schadet aber nicht; im Audio-Modus wird sofort umgeblaettert.
      // (Kehrt die Badge-nur-Sonderregel fuer recall_kandidaten vom 28.07. um.)
      setFlipped(true);
    }

    renderDeck();

    // ── Agenten-Chips: leuchten beim Denken, grün bei Antwort (Hero-Motiv) ──
    const agentEls = Array.from(els.agents?.querySelectorAll("span") || []);
    let agentPtr = 0;
    let agentCurrent = -1;
    function agentsThinking() {
      if (!agentEls.length) return;
      agentEls.forEach((el) => el.classList.remove("is-asking", "is-answered"));
      agentCurrent = agentPtr % agentEls.length;
      agentPtr += 1;
      agentEls[agentCurrent].classList.add("is-asking");
    }
    function agentsAnswered() {
      if (agentCurrent < 0 || !agentEls[agentCurrent]) return;
      agentEls[agentCurrent].classList.remove("is-asking");
      agentEls[agentCurrent].classList.add("is-answered");
    }
    function agentsClear() {
      agentEls.forEach((el) => el.classList.remove("is-asking", "is-answered"));
      agentCurrent = -1;
    }

    // ── Zustandsmaschine: ein Button, Farben erzählen den Rest ───────────────
    // phase: idle | ringing | connecting | live | ended
    // voice (nur live): listening | user | thinking | clara
    // wakeStandby (nur live): Wake-Word-Pause ("Clara stopp") — überlagert
    // listening/user als eigener gelber Ruhezustand, bis "Clara start" kommt.
    const ALL_ST = ["st-idle","st-ringing","st-connecting","st-listening","st-user","st-thinking","st-clara","st-standby","st-ended"];

    const LABELS = {
      idle:       ["", "Tippen zum Sprechen"],
      ringing:    ["Clara ruft an", "Tippen zum Annehmen"],
      connecting: ["Verbinde …", ""],
      listening:  ["Ich höre zu", "Tippen zum Auflegen"],
      user:       ["Du sprichst", ""],
      thinking:   ["Clara denkt nach …", ""],
      clara:      ["Clara spricht", ""],
      standby:    ["Pausiert", "Sag „Clara Start“"],
      ended:      ["Anruf beendet", "Tippen für neue Verbindung"],
    };

    function syncChatVisual() {
      if (chatUi.getMode() !== "chat") return;
      if (!connected && !connecting) {
        chatUi.setConnectVisible(true);
        chatUi.setChatVisual("idle");
        return;
      }
      chatUi.setConnectVisible(false);
      if (connecting || phase === "connecting") {
        chatUi.setChatVisual("connecting");
      } else if (phase === "live" && voice === "thinking") {
        chatUi.setChatVisual("thinking");
      } else if (phase === "live" && voice === "clara") {
        chatUi.setChatVisual("writing");
      } else if (connected) {
        chatUi.setStatusLine("");
        chatUi.setChatVisual("listening");
      }
    }

    let lastAgentState = "";
    function render() {
      // Standby überdeckt nur die Ruhe-Zustände: Claras eigene Quittung
      // ("Gestoppt.") pulst weiter grün, Denken bleibt gelb-pulsierend.
      const live = phase === "live";
      const overlayStandby = live && wakeStandby && (voice === "listening" || voice === "user");
      const st = overlayStandby ? "standby" : (live ? voice : phase);
      document.body.classList.remove(...ALL_ST);
      document.body.classList.add("st-" + st);
      const key = st;
      const [label, hint] = LABELS[key] || ["", ""];
      els.stateLabel.textContent = label;
      els.hint.textContent = hint;
      els.btnDecline.classList.toggle("hidden", phase !== "ringing");
      if (els.cardsStateLabel) els.cardsStateLabel.textContent = label || "Bereit";
      // Agenten-Chips folgen dem echten Zustand (Hero: fragt … / beantwortet)
      // — nur bei ZUSTANDSWECHSEL, sonst springt der Zeiger pro Re-Render.
      if (st !== lastAgentState) {
        lastAgentState = st;
        if (st === "thinking") agentsThinking();
        else if (st === "clara") agentsAnswered();
        else if (st === "ended") agentsClear();
      }
      syncChatVisual();
    }

    els.reason.textContent = reasonText;
    if (!incoming) {
      els.calling.textContent = device?.operatorName ? `Hallo ${device.operatorName}` : "Deine Praxis-Assistentin";
    }
    render();

    // ── Ringtone (best effort): WebAudio dual-tone like a classic phone ring.
    let ringCtx = null;
    let ringTimer = null;
    function startRing() {
      try {
        ringCtx = new (window.AudioContext || window.webkitAudioContext)();
        const ringOnce = () => {
          if (!ringCtx) return;
          const t0 = ringCtx.currentTime;
          for (const f of [440, 480]) {
            const o = ringCtx.createOscillator();
            const g = ringCtx.createGain();
            o.frequency.value = f;
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.linearRampToValueAtTime(0.08, t0 + 0.05);
            g.gain.setValueAtTime(0.08, t0 + 1.6);
            g.gain.linearRampToValueAtTime(0.0001, t0 + 1.8);
            o.connect(g).connect(ringCtx.destination);
            o.start(t0); o.stop(t0 + 1.9);
          }
        };
        ringOnce();
        ringTimer = setInterval(ringOnce, 3600); // ring … pause … ring
        if (navigator.vibrate) navigator.vibrate([400,150,400,150,400]);
      } catch {}
    }
    function stopRing() {
      if (ringTimer) { clearInterval(ringTimer); ringTimer = null; }
      if (ringCtx) { try { ringCtx.close(); } catch {} ringCtx = null; }
      if (navigator.vibrate) navigator.vibrate(0);
    }
    if (incoming) startRing();

    // ── LiveKit (same hardened logic as the car/connect page) ───────────────
    async function tryPlayAudio() {
      try {
        els.audio.muted = false;
        els.audio.volume = 1;
        if (room && typeof room.startAudio === "function" && room.canPlaybackAudio === false) {
          await room.startAudio();
        }
        await els.audio.play();
        showEnable(false);
        return true;
      } catch { showEnable(true); return false; }
    }

    function attachRouteRecovery() {
      if (!navigator.mediaDevices || attachRouteRecovery._wired) return;
      attachRouteRecovery._wired = true;
      navigator.mediaDevices.addEventListener("devicechange", () => {
        if (!connected) return;
        setTimeout(tryPlayAudio, 300);
      });
    }

    // ── Mikro-Pegel: erkennt lokal, ob der Nutzer gerade spricht ─────────────
    let micCtx = null;
    let micRaf = 0;
    let userQuietSince = 0;
    function watchMicLevel() {
      try {
        const pubs = room?.localParticipant?.audioTrackPublications;
        const pub = pubs ? [...pubs.values()][0] : null;
        const mst = pub?.track?.mediaStreamTrack;
        if (!mst) { setTimeout(watchMicLevel, 500); return; }
        micCtx = new (window.AudioContext || window.webkitAudioContext)();
        const srcNode = micCtx.createMediaStreamSource(new MediaStream([mst]));
        const analyser = micCtx.createAnalyser();
        analyser.fftSize = 512;
        srcNode.connect(analyser);
        const buf = new Uint8Array(analyser.frequencyBinCount);
        const tick = () => {
          micRaf = requestAnimationFrame(tick);
          if (phase !== "live") return;
          analyser.getByteTimeDomainData(buf);
          let sum = 0;
          for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; sum += v * v; }
          const rms = Math.sqrt(sum / buf.length);
          const now = performance.now();
          // Clara-Sprechen und Denken haben Vorrang vor dem Mikro-Pegel
          if (voice === "clara" || voice === "thinking") return;
          if (rms > 0.045) {
            userQuietSince = 0;
            if (voice !== "user") { voice = "user"; render(); }
          } else if (voice === "user") {
            if (!userQuietSince) userQuietSince = now;
            if (now - userQuietSince > 700) { voice = "listening"; render(); }
          }
        };
        tick();
      } catch {}
    }
    function stopMicWatch() {
      if (micRaf) { cancelAnimationFrame(micRaf); micRaf = 0; }
      if (micCtx) { try { micCtx.close(); } catch {} micCtx = null; }
    }

    async function syncMicForMode(mode) {
      if (!room?.localParticipant || !connected) return;
      try {
        await room.localParticipant.setMicrophoneEnabled(mode === "audio");
        if (mode === "audio") watchMicLevel();
        else stopMicWatch();
      } catch {}
    }

    // ── Bildschirm wachhalten während eines aktiven Anrufs ───────────────────
    // Ohne das schaltet das Handy nach seiner Display-Zeit ab; Mobil-Browser
    // (v.a. iOS Safari) frieren dann JS + WebRTC ein und der Ton verstummt
    // mitten im Gespräch. Der Screen-WakeLock hält das Display an, solange
    // Clara verbunden ist. Das Betriebssystem gibt ihn beim Wegblenden von
    // selbst frei — deshalb wird er bei Rückkehr neu angefordert.
    let wakeLock = null;
    async function requestWakeLock() {
      try {
        if (!("wakeLock" in navigator) || wakeLock) return;
        wakeLock = await navigator.wakeLock.request("screen");
        // Wird der Lock (durch OS/Hintergrund) freigegeben, Referenz leeren,
        // damit visibilitychange ihn sauber neu anfordern kann.
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      } catch { wakeLock = null; }
    }
    async function releaseWakeLock() {
      try { if (wakeLock) await wakeLock.release(); } catch {}
      wakeLock = null;
    }

    // Kommt die App aus dem Hintergrund zurück (oder das Display geht wieder
    // an), WakeLock erneuern und Tonausgabe/Mikro-Analyse reaktivieren — iOS
    // und Android suspenden <audio> + AudioContext beim Wegblenden.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible" || !connected) return;
      requestWakeLock();
      try { if (micCtx && micCtx.state === "suspended") micCtx.resume(); } catch {}
      if (!chatPipeline) tryPlayAudio();
    });

    async function connect({ textOnly = false } = {}) {
      if (connecting || connected) return;
      if (!clientId) {
        setStatus("Handy ist nicht gekoppelt – bitte QR-Code scannen.");
        location.replace("/m/pair.html?manage=1");
        return;
      }
      const forChat = textOnly || chatUi.getMode() === "chat";
      chatPipeline = forChat;
      connecting = true;
      stopRing();
      phase = forChat ? "live" : "connecting";
      wakeStandby = false;
      render();
      setStatus(forChat ? "Chat-Verbindung …" : "");
      try {
        const body = { clientId };
        if (forChat) body.pipeline = "text";
        // Paired phone -> Clara knows WHO answers, no PIN needed.
        if (device?.deviceId && device?.deviceKey && device.clientId === clientId) {
          body.deviceId = device.deviceId;
          body.deviceKey = device.deviceKey;
        }
        const resp = await fetch("/clara/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        if (!resp.ok) {
          const err = await resp.json().catch(() => ({}));
          throw new Error(err.error || `HTTP ${resp.status}`);
        }
        const cfg = await resp.json();
        if (cfg.operator?.name) els.calling.textContent = `Verbunden · ${cfg.operator.name}`;

        room = new Room({
          adaptiveStream: true,
          dynacast: true,
          audioCaptureDefaults: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
        });
        room.on(RoomEvent.TrackSubscribed, (track) => {
          if (chatPipeline || track.kind !== Track.Kind.Audio || audioAttached) return;
          track.attach(els.audio);
          audioAttached = true;
          tryPlayAudio();
        });
        room.on(RoomEvent.AudioPlaybackStatusChanged, () => {
          showEnable(room && room.canPlaybackAudio === false);
        });
        room.on(RoomEvent.Disconnected, () => {
          connected = false; audioAttached = false; showEnable(false);
          teardownUI();
        });

        // Psychologie der Verbindung: NICHT sofort "Verbunden" zeigen und dann
        // Stille. Der Status bleibt im Verbinde-Modus, bis Clara wirklich zu
        // sprechen beginnt (erstes audio_state=speaking = die Begruessung).
        let claraLive = false;
        const markClaraLive = () => {
          if (claraLive || !connected) return;
          claraLive = true;
          if (phase === "connecting") { phase = "live"; voice = "listening"; render(); }
        };
        room.on(RoomEvent.DataReceived, (payload, _participant, _kind, topic) => {
          if (topic && topic !== "pickadoc.evt") return;
          try {
            const obj = JSON.parse(new TextDecoder().decode(payload));
            if (!obj || !obj.type) return;
            chatUi.handleEvent(obj);
            if (obj.type === "audio_state") {
              if (obj.state === "speaking") {
                markClaraLive();
                phase = "live"; voice = "clara"; render();
              } else if (phase === "live" && voice === "clara") {
                voice = "listening"; render();
              }
            } else if (obj.type === "final_transcript" && phase === "live" && !wakeStandby) {
              // Nutzer-Satz ist fertig -> Clara holt Tools / denkt nach,
              // bis das naechste audio_state=speaking kommt.
              voice = "thinking"; render();
            } else if (obj.type === "wake_state") {
              // Wake-Word (09.07.2026): "Clara stopp" -> gelbes Pausiert,
              // "Clara start" -> sofort zurück zu "Ich höre zu". Kommt
              // idempotent vom Worker, die Anzeige heilt sich selbst.
              const standby = obj.state === "standby";
              if (standby !== wakeStandby) {
                wakeStandby = standby;
                if (phase === "live" && voice === "thinking" && standby) voice = "listening";
                render();
              }
            }
          } catch {}
        });

        await room.connect(cfg.url, cfg.token, { autoSubscribe: true });
        await room.localParticipant.setMicrophoneEnabled(!forChat);
        connected = true;
        connecting = false;
        requestWakeLock();
        if (forChat) {
          voice = "listening";
          setStatus("verbunden – tippe deine Nachricht");
        } else {
          setStatus("Clara meldet sich gleich …");
        }
        render();
        if (!forChat) {
          // Sicherheitsnetz: falls die Begruessung ausbleibt (z.B. Mikro-Freigabe
          // verzoegert), nach 30 s trotzdem auf "Verbunden" umschalten.
          setTimeout(markClaraLive, 30000);
        }
        attachRouteRecovery();
        if (!forChat && chatUi.getMode() === "audio") watchMicLevel();
        if (!forChat) await tryPlayAudio();
        // Load Clara's persona + tools in the worker (once).
        try {
          if (forChat) {
            const pipe = new TextEncoder().encode(JSON.stringify({ type: "set_pipeline", mode: "text" }));
            await room.localParticipant.publishData(pipe, { topic: "pickadoc.cmd", reliable: true });
          }
          const data = new TextEncoder().encode(JSON.stringify({
            type: "set_profile",
            profile_id: cfg.profileId,
            ...(forChat ? { pipeline: "text" } : {}),
          }));
          await room.localParticipant.publishData(data, { topic: "pickadoc.cmd", reliable: true });
        } catch {}
      } catch (e) {
        connecting = false;
        setStatus("Verbindung fehlgeschlagen: " + String(e.message || e));
        phase = incoming ? "ringing" : "idle";
        render();
        if (chatUi.getMode() === "chat") {
          chatUi.setConnectVisible(true);
          chatUi.setChatVisual("idle");
        }
      }
    }

    function teardownUI() {
      stopMicWatch();
      releaseWakeLock();
      chatPipeline = false;
      phase = "ended";
      voice = "listening";
      wakeStandby = false;
      els.calling.textContent = "Anruf beendet";
      setStatus("");
      render();
    }

    async function hangup() {
      if (room) { try { await room.disconnect(); } catch {} room = null; }
      connected = false;
      teardownUI();
    }

    // Ein Button für alles: annehmen, verbinden, auflegen, neu verbinden.
    els.orb.addEventListener("click", () => {
      if (phase === "connecting") return;
      if (phase === "live") { hangup(); return; }
      connect();
    });

    els.btnDecline.addEventListener("click", () => {
      stopRing();
      phase = "ended";
      els.calling.textContent = "Abgelehnt";
      render();
      setTimeout(() => { try { window.close(); } catch {} }, 400);
    });
    els.enableBtn.addEventListener("click", tryPlayAudio);
    els.chatEnableBtn?.addEventListener("click", tryPlayAudio);

    if (proofFromUrl && clientId) {
      fetch(`/clara/proof/${encodeURIComponent(clientId)}/${encodeURIComponent(proofFromUrl)}.svg`)
        .then((r) => r.ok ? r.text() : null)
        .then((svg) => {
          if (!svg) return;
          const blob = new Blob([svg], { type: "image/svg+xml" });
          chatUi.showProof({
            title: "Termin eingetragen",
            imageUrl: URL.createObjectURL(blob),
          });
          chatUi.setMode("chat");
        })
        .catch(() => {});
    }
  </script>
</body>
</html>
