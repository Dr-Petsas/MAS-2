<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MAS Fernsteuerung</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --panel2: #222c42; --text: #e8edf6;
    --muted: #8a96ad; --accent: #4f8cff; --me: #2e57a8; --agent: #263450;
    --ok: #3ddc84; --warn: #ffb347; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 16px calc(8px); background: var(--panel);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  #status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; }
  #board {
    background: var(--panel2); padding: 10px 16px; font-size: 13.5px;
    line-height: 1.45; color: #c8d3e8; white-space: pre-wrap;
    max-height: 32dvh; overflow-y: auto; flex-shrink: 0;
    border-bottom: 1px solid #2c3954;
  }
  #board .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 4px; }
  #board.empty { display: none; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 14px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--agent); border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 10.5px; color: rgba(232,237,246,.55); margin-top: 4px; }
  .msg .st { font-style: italic; }
  form {
    display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); flex-shrink: 0;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid #33415f; border-radius: 12px;
    background: #121a2b; color: var(--text); font: inherit; font-size: 16px;
    padding: 10px 12px; min-height: 44px; max-height: 120px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    border: 0; border-radius: 12px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; padding: 0 18px; min-height: 44px;
  }
  button:disabled { opacity: .5; }
  #err { color: var(--err); font-size: 12.5px; padding: 4px 16px; display: none; background: var(--panel); }
</style>
</head>
<body>
<header>
  <h1>MAS Fernsteuerung</h1>
  <span id="status"><span id="dot"></span><span id="stxt">verbinde…</span></span>
</header>
<div id="board" class="empty"><span class="lbl">Resümee &amp; Empfehlungen</span><span id="boardText"></span></div>
<div id="chat"></div>
<div id="err"></div>
<form id="f">
  <textarea id="t" placeholder="Auftrag an den Agenten…" rows="1"></textarea>
  <button id="send" type="submit">Senden</button>
</form>
<script>
(function () {
  "use strict";
  var TOKEN = (location.hash || "").replace(/^#t=/, "").trim();
  var FS_URL = "https://firestore.googleapis.com/v1/projects/docgenda/databases/(default)/documents/settings/masRuntime?key=AIzaSyCG65EB0gojy6cIUO23eJ1gM2mMi7DjLLI";
  var base = "";
  var lastRender = "";
  var chat = document.getElementById("chat");
  var boardBox = document.getElementById("board");
  var boardText = document.getElementById("boardText");
  var dot = document.getElementById("dot");
  var stxt = document.getElementById("stxt");
  var errBox = document.getElementById("err");
  var form = document.getElementById("f");
  var ta = document.getElementById("t");
  var btn = document.getElementById("send");

  function setStatus(color, text) { dot.style.background = color; stxt.textContent = text; }
  function showErr(msg) { errBox.textContent = msg; errBox.style.display = msg ? "block" : "none"; }

  if (!TOKEN) {
    setStatus("var(--err)", "kein Token");
    showErr("Im Link fehlt der Zugangsschlüssel (#t=…). Bitte den Link aus der E-Mail verwenden.");
    btn.disabled = true;
  }

  function resolveBase() {
    return fetch(FS_URL).then(function (r) { return r.json(); }).then(function (d) {
      var url = (d && d.fields && d.fields.baseUrl && d.fields.baseUrl.stringValue || "").replace(/\/+$/, "");
      if (url.indexOf("https://") === 0) base = url;
      return base;
    });
  }

  function fmtTime(ms) {
    if (!ms) return "";
    var d = new Date(ms);
    return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + ". " +
           ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function statusLabel(s) {
    if (s === "neu") return "wartet auf Abruf";
    if (s === "in_arbeit") return "Agent arbeitet…";
    return "";
  }

  function render(state) {
    var key = JSON.stringify(state);
    if (key === lastRender) return;
    lastRender = key;
    var b = state.board && state.board.text || "";
    if (b) {
      boardText.textContent = b;
      boardBox.classList.remove("empty");
    } else {
      boardBox.classList.add("empty");
    }
    var nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
    chat.innerHTML = "";
    (state.messages || []).forEach(function (m) {
      var div = document.createElement("div");
      div.className = "msg " + (m.role === "agent" ? "agent" : "user");
      var txt = document.createElement("div");
      txt.textContent = m.text || "";
      div.appendChild(txt);
      var meta = document.createElement("div");
      meta.className = "meta";
      var st = m.role === "user" ? statusLabel(m.status) : "";
      meta.innerHTML = fmtTime(m.createdAt) + (st ? ' &middot; <span class="st">' + st + "</span>" : "");
      div.appendChild(meta);
      chat.appendChild(div);
    });
    if (nearBottom || chat.childElementCount <= 3) chat.scrollTop = chat.scrollHeight;
  }

  var failCount = 0;
  function poll() {
    if (!TOKEN) return;
    var attempt = base
      ? Promise.resolve(base)
      : resolveBase();
    attempt.then(function () {
      if (!base) throw new Error("keine Backend-URL");
      return fetch(base + "/remote/state?token=" + encodeURIComponent(TOKEN));
    }).then(function (r) {
      if (r.status === 401) throw new Error("Token ungültig");
      return r.json();
    }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "Fehler");
      failCount = 0;
      setStatus("var(--ok)", "verbunden");
      showErr("");
      render(d);
    }).catch(function (e) {
      failCount++;
      // Tunnel koennte gewechselt haben: Basis-URL frisch aufloesen.
      if (failCount >= 2) base = "";
      setStatus("var(--warn)", "Verbindung…");
      if (failCount >= 4) {
        setStatus("var(--err)", "getrennt");
        showErr("Backend gerade nicht erreichbar (" + e.message + "). Es wird automatisch weiter versucht.");
      }
    });
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = ta.value.trim();
    if (!text || !TOKEN) return;
    btn.disabled = true;
    var go = base ? Promise.resolve() : resolveBase();
    go.then(function () {
      return fetch(base + "/remote/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: TOKEN, text: text }),
      });
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "Senden fehlgeschlagen");
      ta.value = "";
      ta.style.height = "auto";
      showErr("");
      poll();
    }).catch(function (e) {
      base = "";
      showErr("Senden fehlgeschlagen: " + e.message + " — bitte nochmal versuchen.");
    }).then(function () { btn.disabled = false; ta.focus(); });
  });

  ta.addEventListener("input", function () {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
  });
  ta.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) form.requestSubmit();
  });

  poll();
  setInterval(poll, 8000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) poll();
  });
})();
</script>
</body>
</html>
