<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>MAS Fernsteuerung</title>
<style>
  :root {
    --bg: #0f1420; --panel: #1a2233; --panel2: #222c42; --text: #e8edf6;
    --muted: #8a96ad; --accent: #4f8cff; --me: #2e57a8; --agent: #263450;
    --ok: #3ddc84; --warn: #ffb347; --err: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    padding: 12px 16px calc(8px); background: var(--panel);
    display: flex; align-items: center; gap: 10px; flex-shrink: 0;
    padding-top: calc(12px + env(safe-area-inset-top));
  }
  header h1 { font-size: 17px; font-weight: 600; flex: 1; }
  #status { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--warn); display: inline-block; }
  #board {
    background: var(--panel2); padding: 10px 16px; font-size: 13.5px;
    line-height: 1.45; color: #c8d3e8; white-space: pre-wrap;
    max-height: 32dvh; overflow-y: auto; flex-shrink: 0;
    border-bottom: 1px solid #2c3954;
  }
  #board .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: block; margin-bottom: 4px; }
  #board.empty { display: none; }
  #chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 8px; }
  .msg { max-width: 86%; padding: 9px 12px; border-radius: 14px; font-size: 15px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .msg.user { align-self: flex-end; background: var(--me); border-bottom-right-radius: 4px; }
  .msg.agent { align-self: flex-start; background: var(--agent); border-bottom-left-radius: 4px; }
  .msg .meta { font-size: 10.5px; color: rgba(232,237,246,.55); margin-top: 4px; }
  .msg .st { font-style: italic; }
  /* WER spricht? (Chef 18.08.2026) Am Draht haengt ein Dreierteam: Opus fuehrt,
     Grok prueft nach, Fable macht den Feinschliff. Absender ueber der Blase,
     eigene Farbe je Kopf. Alte Nachrichten ohne Absender bleiben schlicht. */
  .msg.agent { border-left: 3px solid #33415f; }
  .msg.agent .wer { font-size: 10.5px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 4px; }
  .msg.von-opus { border-left-color: #3ddc84; }
  .msg.von-opus .wer { color: #3ddc84; }
  .msg.von-grok { border-left-color: #ffb347; }
  .msg.von-grok .wer { color: #ffb347; }
  .msg.von-fable { border-left-color: #c58cff; }
  .msg.von-fable .wer { color: #c58cff; }
  .msg.von-team { border-left-color: #8a96ad; }
  .msg.von-team .wer { color: #a9bad6; }
  form {
    display: flex; gap: 8px; padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    background: var(--panel); flex-shrink: 0;
  }
  textarea {
    flex: 1; resize: none; border: 1px solid #33415f; border-radius: 12px;
    background: #121a2b; color: var(--text); font: inherit; font-size: 16px;
    padding: 10px 12px; min-height: 44px; max-height: 120px; outline: none;
  }
  textarea:focus { border-color: var(--accent); }
  button {
    border: 0; border-radius: 12px; background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; padding: 0 18px; min-height: 44px;
  }
  button:disabled { opacity: .5; }
  #err { color: var(--err); font-size: 12.5px; padding: 4px 16px; display: none; background: var(--panel); }
  #agent {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 7px 16px; font-size: 12.5px; color: #cdd8ec;
    background: var(--panel); border-bottom: 1px solid #2c3954;
  }
  #agent.hidden { display: none; }
  #agent .pdot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex-shrink: 0; }
  #agent.live .pdot { background: var(--ok); animation: pulse 1.1s ease-in-out infinite; }
  #agent.live { color: #b9f2d6; }
  #agent.warns .pdot { background: var(--warn); animation: pulse 1.6s ease-in-out infinite; }
  #agent.warns { color: #ffe0a8; }
  #agent.dead .pdot { background: var(--err); }
  #agent.dead { color: #ffc2c2; }
  @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(1.6); } 100% { opacity: 1; transform: scale(1); } }
  #toEnd {
    position: fixed; right: 14px;
    bottom: calc(74px + env(safe-area-inset-bottom));
    width: 44px; height: 44px; border-radius: 50%; padding: 0;
    background: var(--accent); color: #fff; font-size: 22px; line-height: 44px;
    box-shadow: 0 3px 12px rgba(0,0,0,.45); z-index: 20; text-align: center;
  }
  #toEnd:active { transform: scale(.94); }
  /* Buero-Klammer: Dateien vom Handy an den Agenten (Chef 09.08.2026). */
  #clip {
    background: #2c3954; color: #cdd8ec; font-size: 19px;
    padding: 0 13px; min-height: 44px; border-radius: 12px;
  }
  #clip.busy { opacity: .5; }
  #datei { display: none; }
</style>
</head>
<body>
<header>
  <h1>MAS Fernsteuerung</h1>
  <span id="status"><span id="dot"></span><span id="stxt">verbinde…</span></span>
</header>
<div id="agent" class="hidden"><span class="pdot"></span><span id="agentTxt"></span></div>
<div id="board" class="empty"><span class="lbl">Resümee &amp; Empfehlungen</span><span id="boardText"></span></div>
<div id="chat"></div>
<button id="toEnd" type="button" title="Zum Ende springen" aria-label="Zum Ende springen">↓</button>
<div id="err"></div>
<form id="f">
  <input id="datei" type="file" multiple>
  <button id="clip" type="button" title="Datei anhängen" aria-label="Datei anhängen">📎</button>
  <textarea id="t" placeholder="Auftrag an den Agenten…" rows="1"></textarea>
  <button id="send" type="submit">Senden</button>
</form>
<script>
(function () {
  "use strict";
  var TOKEN = (location.hash || "").replace(/^#t=/, "").trim();
  var FS_URL = "https://firestore.googleapis.com/v1/projects/docgenda/databases/(default)/documents/settings/masRuntime?key=AIzaSyCG65EB0gojy6cIUO23eJ1gM2mMi7DjLLI";
  var base = "";
  var lastRender = "";
  var chat = document.getElementById("chat");
  var boardBox = document.getElementById("board");
  var boardText = document.getElementById("boardText");
  var dot = document.getElementById("dot");
  var stxt = document.getElementById("stxt");
  var errBox = document.getElementById("err");
  var form = document.getElementById("f");
  var ta = document.getElementById("t");
  var btn = document.getElementById("send");
  var agentBox = document.getElementById("agent");
  var agentTxt = document.getElementById("agentTxt");
  var toEnd = document.getElementById("toEnd");

  // Sofort ans Ende des Verlaufs springen (auf Wunsch von Dr. Petsas).
  if (toEnd) toEnd.addEventListener("click", function () {
    chat.scrollTop = chat.scrollHeight;
  });

  // Lebenspuls-Verfolgung ausschliesslich mit der GERAETE-Uhr (kein Vergleich von
  // Server- gegen Handy-Zeit -> keine Zeitzonen-/Uhr-Verschiebung). Wir merken uns
  // NUR, WANN sich der Server-Board-Zeitstempel zuletzt geaendert hat.
  var liveStamp = null;      // zuletzt gesehener board.updatedAt (Servertakt, nur Gleichheit zaehlt)
  var liveChangedAt = 0;     // Geraete-Zeit, als er sich zuletzt aenderte
  var workId = null;         // id der aktuell in Arbeit befindlichen Nachricht
  var workSeenAt = 0;        // Geraete-Zeit, als wir sie zuerst "in Arbeit" sahen
  var lastState = null;      // letzter Zustand fuer den Sekundentakt

  function fmtDur(ms) {
    var s = Math.max(0, Math.round(ms / 1000));
    if (s < 60) return s + " Sek.";
    var m = Math.floor(s / 60), r = s % 60;
    return m + ":" + ("0" + r).slice(-2) + " Min.";
  }

  function setAgent(cls, text) {
    agentBox.className = cls ? cls : "hidden";
    if (cls) agentTxt.textContent = text;
  }

  // Aus dem Zustand ableiten, ob ich arbeite / haenge / bereit bin.
  function updateAgentStatus(state) {
    var now = Date.now();
    var stamp = state && state.board ? (state.board.updatedAt || 0) : 0;
    if (stamp !== liveStamp) { liveStamp = stamp; liveChangedAt = now; }

    var msgs = (state && state.messages) || [];
    var lastUser = null;
    for (var i = msgs.length - 1; i >= 0; i--) { if (msgs[i].role === "user") { lastUser = msgs[i]; break; } }
    // Steht nach der letzten Nutzer-Nachricht schon eine Agent-Antwort? -> fertig.
    var answered = msgs.length && msgs[msgs.length - 1].role === "agent";

    if (!lastUser || answered || lastUser.status === "fertig") {
      workId = null;
      setAgent("", "");        // ausblenden -> Kopf-Punkt zeigt die Verbindung
      return;
    }
    if (lastUser.status === "in_arbeit") {
      if (workId !== lastUser.id) { workId = lastUser.id; workSeenAt = now; }
      var pulseAge = now - liveChangedAt;
      var worked = now - workSeenAt;
      if (pulseAge <= 45000) {
        setAgent("live", "Team arbeitet - Puls vor " + Math.round(pulseAge / 1000) + " Sek. (seit " + fmtDur(worked) + ")");
      } else if (pulseAge >= 80000) {
        setAgent("dead", "Kein Lebenszeichen seit " + fmtDur(pulseAge) + " - haengt evtl. oder ist abgestuerzt. Wenn es so bleibt, Nachricht neu senden.");
      } else {
        setAgent("warns", "Team arbeitet (seit " + fmtDur(worked) + ") - warte auf naechstes Lebenszeichen...");
      }
      return;
    }
    // status "neu": gesendet, aber der Draht hat noch nicht abgeholt.
    if (workId !== lastUser.id) { workId = lastUser.id; workSeenAt = now; }
    var waited = now - workSeenAt;
    if (waited > 30000) {
      setAgent("dead", "Der Draht holt die Nachricht nicht ab (evtl. offline). Es wird weiter versucht.");
    } else {
      setAgent("warns", "Gesendet - warte auf Abruf durch den Draht...");
    }
  }

  function setStatus(color, text) { dot.style.background = color; stxt.textContent = text; }
  function showErr(msg) { errBox.textContent = msg; errBox.style.display = msg ? "block" : "none"; }

  if (!TOKEN) {
    setStatus("var(--err)", "kein Token");
    showErr("Im Link fehlt der Zugangsschlüssel (#t=…). Bitte den Link aus der E-Mail verwenden.");
    btn.disabled = true;
  }

  function resolveBase() {
    return fetch(FS_URL).then(function (r) { return r.json(); }).then(function (d) {
      var url = (d && d.fields && d.fields.baseUrl && d.fields.baseUrl.stringValue || "").replace(/\/+$/, "");
      if (url.indexOf("https://") === 0) base = url;
      return base;
    });
  }

  function fmtTime(ms) {
    if (!ms) return "";
    var d = new Date(ms);
    return ("0" + d.getDate()).slice(-2) + "." + ("0" + (d.getMonth() + 1)).slice(-2) + ". " +
           ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2);
  }
  function statusLabel(s) {
    if (s === "neu") return "wartet auf Abruf";
    if (s === "in_arbeit") return "Team arbeitet…";
    return "";
  }
  // Absender-Namen fuer die Blasen. Nur diese vier laesst das Backend durch.
  var NAMEN = {
    opus: "Opus · führt",
    grok: "Grok · prüft",
    fable: "Fable · Feinschliff",
    team: "Team",
  };

  function render(state) {
    var key = JSON.stringify(state);
    if (key === lastRender) return;
    lastRender = key;
    var b = state.board && state.board.text || "";
    if (b) {
      boardText.textContent = b;
      boardBox.classList.remove("empty");
    } else {
      boardBox.classList.add("empty");
    }
    var nearBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 80;
    chat.innerHTML = "";
    (state.messages || []).forEach(function (m) {
      var div = document.createElement("div");
      var wer = m.role === "agent" ? String(m.speaker || "") : "";
      var text = m.text || "";
      // Absender steht auch als erste Zeile im Text ("[Grok]") - so klappt die
      // Anzeige ohne MAS-Neustart. Feld gewinnt, Zeile wird immer entfernt.
      if (m.role === "agent") {
        var marke = text.match(/^\s*\[(opus|grok|fable|team)\]\s*\r?\n?/i);
        if (marke) {
          if (!wer) wer = marke[1].toLowerCase();
          text = text.slice(marke[0].length);
        }
      }
      var name = NAMEN[wer] || "";
      div.className = "msg " + (m.role === "agent" ? "agent" : "user") + (name ? " von-" + wer : "");
      if (name) {
        var w = document.createElement("div");
        w.className = "wer";
        w.textContent = name;
        div.appendChild(w);
      }
      var txt = document.createElement("div");
      txt.textContent = text;
      div.appendChild(txt);
      var meta = document.createElement("div");
      meta.className = "meta";
      var st = m.role === "user" ? statusLabel(m.status) : "";
      meta.innerHTML = fmtTime(m.createdAt) + (st ? ' &middot; <span class="st">' + st + "</span>" : "");
      div.appendChild(meta);
      chat.appendChild(div);
    });
    if (nearBottom || chat.childElementCount <= 3) chat.scrollTop = chat.scrollHeight;
  }

  var failCount = 0;
  function poll() {
    if (!TOKEN) return;
    var attempt = base
      ? Promise.resolve(base)
      : resolveBase();
    attempt.then(function () {
      if (!base) throw new Error("keine Backend-URL");
      return fetch(base + "/remote/state?token=" + encodeURIComponent(TOKEN));
    }).then(function (r) {
      if (r.status === 401) throw new Error("Token ungültig");
      return r.json();
    }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "Fehler");
      failCount = 0;
      setStatus("var(--ok)", "verbunden");
      showErr("");
      render(d);
      lastState = d;
      updateAgentStatus(d);
    }).catch(function (e) {
      failCount++;
      // Tunnel koennte gewechselt haben: Basis-URL frisch aufloesen.
      if (failCount >= 2) base = "";
      setStatus("var(--warn)", "Verbindung…");
      if (failCount >= 4) {
        setStatus("var(--err)", "getrennt");
        showErr("Backend gerade nicht erreichbar (" + e.message + "). Es wird automatisch weiter versucht.");
      }
    });
  }

  form.addEventListener("submit", function (ev) {
    ev.preventDefault();
    var text = ta.value.trim();
    if (!text || !TOKEN) return;
    btn.disabled = true;
    var go = base ? Promise.resolve() : resolveBase();
    go.then(function () {
      return fetch(base + "/remote/message", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: TOKEN, text: text }),
      });
    }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.ok) throw new Error(d.error || "Senden fehlgeschlagen");
      ta.value = "";
      ta.style.height = "auto";
      showErr("");
      poll();
    }).catch(function (e) {
      base = "";
      showErr("Senden fehlgeschlagen: " + e.message + " — bitte nochmal versuchen.");
    }).then(function () { btn.disabled = false; ta.focus(); });
  });

  // --- Dateien anhaengen (Chef 09.08.2026) --------------------------------
  // Die Datei geht an den Rechner zu Hause und landet dort in einem
  // Posteingang-Ordner; in den Chat kommt eine Nachricht mit dem Ablageort,
  // damit der Agent sie sich ansehen kann. Der Text im Eingabefeld wird als
  // Bemerkung mitgeschickt ("schau dir den Fehler oben rechts an").
  var clip = document.getElementById("clip");
  var datei = document.getElementById("datei");
  if (clip && datei) {
    clip.addEventListener("click", function () { datei.click(); });
    datei.addEventListener("change", function () {
      var liste = Array.prototype.slice.call(datei.files || []);
      if (!liste.length || !TOKEN) return;
      clip.classList.add("busy");
      clip.disabled = true;
      var bemerkung = ta.value.trim();
      showErr("");
      var go = base ? Promise.resolve() : resolveBase();
      // Nacheinander, nicht gleichzeitig: So bleibt die Reihenfolge im Chat
      // erhalten und ein Handy-Netz wird nicht ueberfahren.
      liste.forEach(function (f) {
        go = go.then(function () {
          return new Promise(function (fertig, fehler) {
            var leser = new FileReader();
            leser.onerror = function () { fehler(new Error("Datei nicht lesbar")); };
            leser.onload = function () { fertig(String(leser.result || "")); };
            leser.readAsDataURL(f);
          });
        }).then(function (daten) {
          return fetch(base + "/remote/upload", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: TOKEN, name: f.name, data: daten, note: bemerkung }),
          });
        }).then(function (r) { return r.json(); }).then(function (d) {
          if (!d.ok) throw new Error(d.reason || d.error || "Senden fehlgeschlagen");
          bemerkung = "";  // Bemerkung gehoert nur an die erste Datei
        });
      });
      go.then(function () {
        ta.value = "";
        ta.style.height = "auto";
        poll();
      }).catch(function (e) {
        base = "";
        showErr("Datei kam nicht an: " + e.message + " — bitte nochmal versuchen.");
      }).then(function () {
        clip.classList.remove("busy");
        clip.disabled = false;
        datei.value = "";
      });
    });
  }

  ta.addEventListener("input", function () {
    ta.style.height = "auto";
    ta.style.height = Math.min(ta.scrollHeight, 120) + "px";
  });
  ta.addEventListener("keydown", function (ev) {
    if (ev.key === "Enter" && (ev.ctrlKey || ev.metaKey)) form.requestSubmit();
  });

  poll();
  setInterval(poll, 5000);
  // Sekundentakt: laesst "Puls vor X Sek." und "arbeitet seit ..." fluessig
  // weiterlaufen und schlaegt bei ausbleibendem Puls auch ohne neue Abfrage an.
  setInterval(function () { if (lastState) updateAgentStatus(lastState); }, 1000);
  document.addEventListener("visibilitychange", function () {
    if (!document.hidden) poll();
  });
})();
</script>
</body>
</html>
